name: Import commissioned CI Academy artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import-artwork.py'
      - '.github/workflows/import-artwork.yml'
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - run: python scripts/import-artwork.py
      - name: Commit local CI illustration assets
        run: |
          git config user.name "CI Academy art importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/original-art artwork-thumbnails.js reports/illustration-import.json
          if ! git diff --cached --quiet; then
            git commit -m "Add locally hosted original CI Academy generated illustration assets"
            git push
          fi
